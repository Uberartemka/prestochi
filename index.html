<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Компонент Сервис — Презентация для партнёров HHB</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600;800&family=Noto+Sans+SC:wght@300;400;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-dark lang-ru">

  <header class="top-bar">
    <div class="brand">
      <span class="brand-mark">CS</span>
      <span class="brand-name" data-i18n="brand.name"></span>
    </div>
    <div class="lang-switch">
      <button class="lang-btn" data-lang-set="ru" data-lang-id="ru">RU</button>
      <span class="lang-sep">·</span>
      <button class="lang-btn" data-lang-set="zh" data-lang-id="zh">中文</button>
    </div>
  </header>

  <!-- ================== СЕКЦИЯ 1: ОБЛОЖКА ================== -->
  <section class="cover">
    <div class="cover-grid">
      <div class="cover-text">
        <div class="cover-eyebrow">
          <span class="dot-red"></span>
          <span data-i18n="cover.eyebrow"></span>
        </div>

        <h1 class="cover-title" data-i18n="cover.title"></h1>

        <div class="lang-secondary cover-zh" data-i18n-sec="cover.title"></div>

        <div class="cover-by" data-i18n="cover.by"></div>
      </div>
    </div>

    <div class="scroll-cue" id="scrollCue">
      <span data-i18n="scroll.cue"></span>
      <span class="scroll-arrow">↓</span>
    </div>
  </section>

  <!-- ================== СЕКЦИЯ 2: КАРТА ================== -->
  <section class="map-section">
    <div class="map-sticky">
      <aside class="info-panel">
        <div class="info-titles">
          <div class="eyebrow" data-i18n="map.eyebrow"></div>
          <h2 data-i18n="map.title"></h2>
          <p class="subtitle lang-secondary" data-i18n-sec="map.title"></p>
        </div>

        <div class="counter">
          <div class="counter-block">
            <span class="num" id="counter-current">0</span>
          </div>
          <div class="counter-arrow">→</div>
          <div class="counter-block highlight">
            <span class="num">85</span>
          </div>
          <div class="counter-suffix" data-i18n="map.counter.regions"></div>
        </div>

        <ul class="legend">
          <li>
            <span class="dot dot-current"></span>
            <div>
              <strong data-i18n="map.legend.current.title"></strong>
              <small data-i18n="map.legend.current.desc"></small>
            </div>
          </li>
          <li>
            <span class="dot dot-phase1"></span>
            <div>
              <strong data-i18n="map.legend.phase1.title"></strong>
              <small data-i18n="map.legend.phase1.desc"></small>
            </div>
          </li>
          <li>
            <span class="dot dot-phase2"></span>
            <div>
              <strong data-i18n="map.legend.phase2.title"></strong>
              <small data-i18n="map.legend.phase2.desc"></small>
            </div>
          </li>
          <li>
            <span class="dot dot-phase3"></span>
            <div>
              <strong data-i18n="map.legend.phase3.title"></strong>
              <small data-i18n="map.legend.phase3.desc"></small>
            </div>
          </li>
        </ul>
      </aside>

      <div class="map-stage">
        <div id="map"></div>
      </div>
    </div>

    <div class="scroll-steps">
      <div class="step" data-scene="0">
        <div class="step-card">
          <div class="step-eyebrow" data-i18n="step1.eyebrow"></div>
          <h3 data-i18n="step1.title"></h3>
          <p data-i18n="step1.text"></p>
          <p class="lang-secondary" data-i18n-sec="step1.text"></p>
        </div>
      </div>
      <div class="step" data-scene="1">
        <div class="step-card">
          <div class="step-eyebrow" data-i18n="step2.eyebrow"></div>
          <h3 data-i18n="step2.title"></h3>
          <p data-i18n="step2.text"></p>
          <p class="lang-secondary" data-i18n-sec="step2.text"></p>
        </div>
      </div>
      <div class="step" data-scene="2">
        <div class="step-card">
          <div class="step-eyebrow" data-i18n="step3.eyebrow"></div>
          <h3 data-i18n="step3.title"></h3>
          <p data-i18n="step3.text"></p>
          <p class="lang-secondary" data-i18n-sec="step3.text"></p>
        </div>
      </div>
      <div class="step" data-scene="3">
        <div class="step-card">
          <div class="step-eyebrow" data-i18n="step4.eyebrow"></div>
          <h3 data-i18n="step4.title"></h3>
          <p data-i18n="step4.text"></p>
          <p class="lang-secondary" data-i18n-sec="step4.text"></p>
        </div>
      </div>
      <div class="step" data-scene="4">
        <div class="step-card">
          <div class="step-eyebrow" data-i18n="step5.eyebrow"></div>
          <h3 data-i18n="step5.title"></h3>
          <p data-i18n="step5.text"></p>
          <p class="lang-secondary" data-i18n-sec="step5.text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 3: РЕЗУЛЬТАТЫ ================== -->
  <section class="slide slide-results" data-theme="dark">
    <div class="slide-inner">
      <div class="slide-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="results.eyebrow"></span>
      </div>

      <h2 class="slide-title" data-reveal data-i18n="results.title"></h2>

      <div class="metrics">
        <div class="metric" data-reveal>
          <div class="metric-num" data-count-to="20" data-count-suffix="%">0<span class="metric-unit">%</span></div>
          <div class="metric-label" data-i18n="results.m1.label"></div>
        </div>
        <div class="metric metric-accent" data-reveal>
          <div class="metric-num" data-count-to="50">0</div>
          <div class="metric-label" data-i18n="results.m2.label"></div>
        </div>
        <div class="metric" data-reveal>
          <div class="metric-num">★</div>
          <div class="metric-label" data-i18n="results.m3.label"></div>
        </div>
      </div>

      <div class="slide-footer" data-reveal>
        <span data-i18n="results.footer"></span>
        <span class="lang-secondary" data-i18n-sec="results.footer"></span>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 4: ГРАФИК РОСТА (scrollytelling) ================== -->
  <section class="growth-section" data-theme="light">
    <div class="growth-sticky">
      <aside class="growth-info">
        <div class="slide-eyebrow">
          <span class="dot-red"></span>
          <span data-i18n="growth.eyebrow"></span>
        </div>
        <h2 class="slide-title" data-i18n="growth.title"></h2>
        <p class="growth-lead" data-i18n="growth.lead"></p>

        <div class="growth-stats">
          <div class="growth-stat" data-stat-scene="1">
            <div class="growth-stat-num" data-count-to="100">0</div>
            <div class="growth-stat-label" data-i18n="growth.s1.label"></div>
          </div>
          <div class="growth-stat growth-stat-target" data-stat-scene="2">
            <div class="growth-stat-num" data-count-to="50">0</div>
            <div class="growth-stat-label" data-i18n="growth.s2.label"></div>
          </div>
          <div class="growth-stat">
            <div class="growth-stat-num" data-count-to="1000">0</div>
            <div class="growth-stat-label" data-i18n="growth.s3.label"></div>
          </div>
        </div>
      </aside>

      <div class="growth-stage">
        <div class="growth-chart">
          <!-- Inline SVG-график.
               История начинается с 2025 года: 2025=20, 2026=100 попробовали HHB (СЕЙЧАС).
               Потенциал: 2027=600 текущая база, 2028=1000 ёмкость рынка.
               Y-сетка: 0→y=300, 500→168, 1000→36.
               X (4 точки): 2025→120, 2026→370 (сейчас), 2027→495, 2028→620. -->
          <svg viewBox="0 0 720 380" preserveAspectRatio="xMidYMid meet" class="growth-svg" aria-hidden="true">
            <defs>
              <linearGradient id="growthGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#C8102E" stop-opacity="0.34"/>
                <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="growthGradFuture" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#C8102E" stop-opacity="0.20"/>
                <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
              </linearGradient>
              <clipPath id="historyClip">
                <rect class="history-clip-rect" x="120" y="0" width="0" height="380"/>
              </clipPath>
              <clipPath id="futureClip">
                <rect class="future-clip-rect" x="370" y="0" width="0" height="380"/>
              </clipPath>
            </defs>

            <g class="grid">
              <line x1="56" y1="36"  x2="700" y2="36" />
              <line x1="56" y1="102" x2="700" y2="102"/>
              <line x1="56" y1="168" x2="700" y2="168"/>
              <line x1="56" y1="234" x2="700" y2="234"/>
              <line x1="56" y1="300" x2="700" y2="300"/>
            </g>
            <g class="y-labels">
              <text x="44" y="40"  text-anchor="end">1000</text>
              <text x="44" y="172" text-anchor="end">500</text>
              <text x="44" y="304" text-anchor="end">0</text>
            </g>
            <g class="x-labels">
              <text x="120" y="332" text-anchor="middle">2025</text>
              <text x="370" y="332" text-anchor="middle" class="x-label-now">2026</text>
              <text x="495" y="332" text-anchor="middle" class="x-label-future">2027</text>
              <text x="620" y="332" text-anchor="middle" class="x-label-future">2028</text>
            </g>

            <line class="today-line" x1="370" y1="36" x2="370" y2="300"/>
            <text class="today-label" x="370" y="24" text-anchor="middle">СЕЙЧАС</text>

            <!-- ИСТОРИЯ -->
            <g clip-path="url(#historyClip)">
              <path class="growth-area-history"
                    d="M 120,295 C 245,295 245,274 370,274 L 370,300 L 120,300 Z"
                    fill="url(#growthGrad)" />
              <path class="growth-line-history"
                    d="M 120,295 C 245,295 245,274 370,274"
                    fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" />
            </g>

            <!-- ПЛАН -->
            <g clip-path="url(#futureClip)">
              <path class="growth-area-future"
                    d="M 370,274 C 432,274 432,142 495,142 S 558,36 620,36 L 620,300 L 370,300 Z"
                    fill="url(#growthGradFuture)" />
              <path class="growth-line-future"
                    d="M 370,274 C 432,274 432,142 495,142 S 558,36 620,36"
                    fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="9 7" />
            </g>

            <!-- Точки -->
            <g class="growth-points">
              <g class="point" style="--i:0">
                <circle cx="120" cy="295" r="6"/>
                <text x="120" y="281" text-anchor="middle" class="point-label">20</text>
              </g>
              <g class="point point-now" style="--i:1">
                <circle cx="370" cy="274" r="8"/>
                <text x="370" y="258" text-anchor="middle" class="point-label">100</text>
              </g>
              <g class="point point-future" style="--i:2">
                <circle cx="495" cy="142" r="6"/>
                <text x="495" y="127" text-anchor="middle" class="point-label">600</text>
              </g>
              <g class="point point-future point-target" style="--i:3">
                <circle cx="620" cy="36" r="10"/>
                <text x="620" y="22" text-anchor="middle" class="point-label">1000</text>
              </g>
            </g>
          </svg>

          <div class="growth-axis-title" data-i18n="growth.axis"></div>

          <div class="growth-legend">
            <span class="growth-legend-item"><span class="lg-swatch lg-solid"></span><span data-i18n="growth.legend.history"></span></span>
            <span class="growth-legend-item"><span class="lg-swatch lg-dashed"></span><span data-i18n="growth.legend.plan"></span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sub-step'ы: каждый = одна точка снапа.
         Скроллишь вниз — раскрываются phase'ы графика. -->
    <div class="growth-scroll-steps">
      <div class="growth-step" data-growth-scene="0">
        <div class="growth-step-card">
          <div class="growth-step-eyebrow" data-i18n="growth.step1.eyebrow"></div>
          <h3 data-i18n="growth.step1.title"></h3>
          <p data-i18n="growth.step1.text"></p>
        </div>
      </div>
      <div class="growth-step" data-growth-scene="1">
        <div class="growth-step-card">
          <div class="growth-step-eyebrow" data-i18n="growth.step2.eyebrow"></div>
          <h3 data-i18n="growth.step2.title"></h3>
          <p data-i18n="growth.step2.text"></p>
        </div>
      </div>
      <div class="growth-step" data-growth-scene="2">
        <div class="growth-step-card">
          <div class="growth-step-eyebrow" data-i18n="growth.step3.eyebrow"></div>
          <h3 data-i18n="growth.step3.title"></h3>
          <p data-i18n="growth.step3.text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 5: ОБЛАКО КЛИЕНТОВ ================== -->
  <section class="slide slide-clients" data-theme="light">
    <div class="slide-inner">
      <div class="slide-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="clients.eyebrow"></span>
      </div>

      <h2 class="slide-title" data-reveal data-i18n="clients.title"></h2>

      <p class="clients-lead" data-reveal data-i18n="clients.lead"></p>

      <div class="logo-cloud" id="logoCloud">
        <span class="chip chip-xl chip-accent" data-reveal>Мираторг</span>
        <span class="chip chip-xl chip-accent" data-reveal>Черкизово</span>
        <span class="chip chip-l" data-reveal>Содружество / Курск&nbsp;Агротерминал</span>
        <span class="chip chip-l" data-reveal>ЭкоНива</span>
        <span class="chip chip-l" data-reveal>Благо</span>
        <span class="chip chip-m" data-reveal>Коблик</span>
        <span class="chip chip-m" data-reveal>Черноземье&nbsp;Агрохолдинг</span>
        <span class="chip chip-m" data-reveal>Агротех-Гарант</span>
        <span class="chip chip-m" data-reveal>ГКЗ</span>
        <span class="chip chip-m" data-reveal>Агроэко</span>
      </div>

      <div class="slide-footer" data-reveal>
        <span data-i18n="clients.footer"></span>
        <span class="lang-secondary" data-i18n-sec="clients.footer"></span>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 4: МЕТОД ================== -->
  <section class="slide slide-method" data-theme="light">
    <div class="slide-inner">
      <div class="slide-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="method.eyebrow"></span>
      </div>

      <h2 class="slide-title" data-reveal data-i18n="method.title"></h2>

      <ol class="method-steps">
        <li data-reveal>
          <div class="step-num">01</div>
          <h4 data-i18n="method.s1.h"></h4>
          <p data-i18n="method.s1.p"></p>
        </li>
        <li data-reveal>
          <div class="step-num">02</div>
          <h4 data-i18n="method.s2.h"></h4>
          <p data-i18n="method.s2.p"></p>
        </li>
        <li data-reveal>
          <div class="step-num">03</div>
          <h4 data-i18n="method.s3.h"></h4>
          <p data-i18n="method.s3.p"></p>
        </li>
        <li data-reveal>
          <div class="step-num">04</div>
          <h4 data-i18n="method.s4.h"></h4>
          <p data-i18n="method.s4.p"></p>
        </li>
        <li data-reveal>
          <div class="step-num">05</div>
          <h4 data-i18n="method.s5.h"></h4>
          <p data-i18n="method.s5.p"></p>
        </li>
        <li class="step-final" data-reveal>
          <div class="step-num">06</div>
          <h4 data-i18n="method.s6.h"></h4>
          <p data-i18n="method.s6.p"></p>
        </li>
      </ol>
    </div>
  </section>

  <!-- ================== СЛАЙД 5: ТЕХ ОТДЕЛ ================== -->
  <section class="slide slide-tech" data-theme="light">
    <div class="slide-inner two-col">
      <div class="col-text">
        <div class="slide-eyebrow" data-reveal>
          <span class="dot-red"></span>
          <span data-i18n="tech.eyebrow"></span>
        </div>

        <h2 class="slide-title" data-reveal data-i18n="tech.title"></h2>

        <p class="lead" data-reveal data-i18n="tech.lead"></p>
        <p class="lead lang-secondary" data-i18n-sec="tech.lead"></p>

        <div class="tech-quote" data-reveal data-i18n="tech.quote"></div>
      </div>

      <div class="col-icons">
        <div class="tech-item" data-reveal>
          <div class="ti-icon">🌾</div>
          <div>
            <strong data-i18n="tech.i1.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i1.t"></small>
          </div>
        </div>
        <div class="tech-item" data-reveal>
          <div class="ti-icon">⚙️</div>
          <div>
            <strong data-i18n="tech.i2.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i2.t"></small>
          </div>
        </div>
        <div class="tech-item" data-reveal>
          <div class="ti-icon">🚜</div>
          <div>
            <strong data-i18n="tech.i3.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i3.t"></small>
          </div>
        </div>
        <div class="tech-item" data-reveal>
          <div class="ti-icon">🏭</div>
          <div>
            <strong data-i18n="tech.i4.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i4.t"></small>
          </div>
        </div>
        <div class="tech-item" data-reveal>
          <div class="ti-icon">⛏️</div>
          <div>
            <strong data-i18n="tech.i5.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i5.t"></small>
          </div>
        </div>
        <div class="tech-item" data-reveal>
          <div class="ti-icon">🥛</div>
          <div>
            <strong data-i18n="tech.i6.t"></strong>
            <small class="lang-secondary" data-i18n-sec="tech.i6.t"></small>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 6: ЦИФРОВАЯ СТРАТЕГИЯ ================== -->
  <section class="slide slide-digital" data-theme="dark">
    <div class="slide-inner">
      <div class="slide-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="digital.eyebrow"></span>
      </div>

      <h2 class="slide-title" data-reveal data-i18n="digital.title"></h2>

      <div class="digital-grid">
        <div class="digital-card" data-reveal>
          <div class="dc-icon">🌐</div>
          <h4 data-i18n="digital.c1.h"></h4>
          <p data-i18n="digital.c1.p"></p>
        </div>
        <div class="digital-card" data-reveal>
          <div class="dc-icon">🎬</div>
          <h4 data-i18n="digital.c2.h"></h4>
          <p data-i18n="digital.c2.p"></p>
        </div>
        <div class="digital-card" data-reveal>
          <div class="dc-icon">📱</div>
          <h4 data-i18n="digital.c3.h"></h4>
          <p data-i18n="digital.c3.p"></p>
        </div>
        <div class="digital-card" data-reveal>
          <div class="dc-icon">🎯</div>
          <h4 data-i18n="digital.c4.h"></h4>
          <p data-i18n="digital.c4.p"></p>
        </div>
        <div class="digital-card" data-reveal>
          <div class="dc-icon">🤖</div>
          <h4 data-i18n="digital.c5.h"></h4>
          <p data-i18n="digital.c5.p"></p>
        </div>
        <div class="digital-card" data-reveal>
          <div class="dc-icon">📊</div>
          <h4 data-i18n="digital.c6.h"></h4>
          <p data-i18n="digital.c6.p"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 7: РАЗВИЛКА ================== -->
  <section class="slide slide-fork" data-theme="dark">
    <div class="slide-inner">
      <div class="slide-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="fork.eyebrow"></span>
      </div>

      <h2 class="slide-title" data-reveal data-i18n="fork.title"></h2>

      <div class="fork-grid">
        <div class="fork-col fork-positive" data-reveal>
          <div class="fork-head">
            <div class="fork-check">✓</div>
            <h3 data-i18n="fork.pos.title"></h3>
          </div>
          <ul>
            <li data-i18n="fork.pos.i1"></li>
            <li data-i18n="fork.pos.i2"></li>
            <li data-i18n="fork.pos.i3"></li>
            <li data-i18n="fork.pos.i4"></li>
            <li data-i18n="fork.pos.i5"></li>
          </ul>
        </div>

        <div class="fork-col fork-negative" data-reveal>
          <div class="fork-head">
            <div class="fork-cross">×</div>
            <h3 data-i18n="fork.neg.title"></h3>
          </div>
          <ul>
            <li data-i18n="fork.neg.i1"></li>
            <li data-i18n="fork.neg.i2"></li>
            <li data-i18n="fork.neg.i3"></li>
            <li data-i18n="fork.neg.i4"></li>
            <li data-i18n="fork.neg.i5"></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ================== СЛАЙД 8: ФИНАЛ / CTA ================== -->
  <section class="slide slide-final" data-theme="dark">
    <div class="slide-inner">
      <div class="final-eyebrow" data-reveal>
        <span class="dot-red"></span>
        <span data-i18n="final.eyebrow"></span>
      </div>

      <h2 class="final-title" data-reveal data-i18n="final.title"></h2>

      <div class="final-zh lang-secondary" data-reveal data-i18n-sec="final.title"></div>

      <div class="final-points">
        <div class="final-point" data-reveal data-i18n="final.p1"></div>
        <div class="final-point" data-reveal data-i18n="final.p2"></div>
      </div>

      <div class="final-signature" data-reveal>
        <div class="sig-name" data-i18n="final.sig.name"></div>
        <div class="sig-cta">
          <span data-i18n="final.sig.cta"></span>
          <span class="lang-secondary" data-i18n-sec="final.sig.cta"></span>
        </div>
      </div>
    </div>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
